[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "authlog-summary"
version = "1.1.0"
description = "Read-only SSH auth log summarizer: failed logins per IP and subnet, root and password logins, JSON output (stdlib-only Python)."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TPOALOS"}]
keywords = ["ssh", "log-analysis", "brute-force", "sysadmin"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/TPOALOS/authlog-summary"

[project.scripts]
authlog-summary = "authlog_summary:main"

[tool.setuptools]
py-modules = ["authlog_summary"]
